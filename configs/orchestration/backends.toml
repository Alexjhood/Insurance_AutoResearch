# Sub-agent backend registry — human-owned ground truth (design §4.7 Layer 1).
#
# A backend is a MODEL × THINKING-EFFORT combination. Effort belongs in the
# command template, so "Sonnet 5 low" and "Sonnet 5 medium" are two entries,
# measured independently by `orchestrate backend-stats`.
#
# Lifecycle: add a new model with status = "trial"; it earns status = "default"
# from its scorecard on this repo's actual workload, not from release notes.
# Retire with status = "deprecated" — in-flight delegations finish, new spawns
# refuse it.
#
# `track` must be one of claude/codex/opencode: the run-scope guard only binds a
# research session to those, and the child inherits it via AUTORESEARCH_TRACK.
#
# Command placeholders: {prompt} (argv channel only), {max_turns}, {max_budget_usd}.

# ── Claude Code ──────────────────────────────────────────────────────────────
# Flags verified against `claude --help` on Claude Code 2.1.206 (2026-07-10):
#   -p/--print                 non-interactive
#   --model <full-name|alias>
#   --effort  low|medium|high|xhigh|max   ← the real thinking-effort flag
#   --output-format text|json|stream-json (requires --print)
#   --verbose                  needed for stream-json event output
#   --permission-mode acceptEdits|auto|bypassPermissions|manual|dontAsk|plan
#   --max-budget-usd <amount>  hard spend ceiling (requires --print)
# There is NO `--max-turns` flag in this version; `--max-budget-usd` bounds a
# sub-agent's spend instead, which is the guarantee we actually wanted.
#
# TODO(pin): `--permission-mode acceptEdits` is a valid value, but whether it is
# *sufficient* for a headless sub-agent's Bash tool calls (the `autoresearch`
# commands) is unverified — confirming it needs one real spawn, which the build
# was not allowed to make. If a sub-agent stalls on a permission prompt, the
# candidates are `--permission-mode bypassPermissions` or an explicit
# `--allowed-tools "Bash Edit Read Write"`.

[backends.claude-sonnet-low]
tool = "claude"
command = [
    "claude", "-p",
    "--model", "claude-sonnet-5",
    "--effort", "low",
    "--output-format", "stream-json",
    "--verbose",
    "--permission-mode", "acceptEdits",
    "--max-budget-usd", "{max_budget_usd}",
]
prompt_via = "stdin"
track = "claude"
model_provider = "anthropic"
model_name = "claude-sonnet-5-low"
max_budget_usd = 5.0
tier = "cheap"
status = "trial"
cost_hint = "$"
good_for = ["recipe_tuning", "structured_sweeps"]
avoid_for = ["novel_scripts"]
notes = "Reliable on recipe-only briefs; escalate effort for repair-heavy estimators."

[backends.claude-sonnet-medium]
tool = "claude"
command = [
    "claude", "-p",
    "--model", "claude-sonnet-5",
    "--effort", "medium",
    "--output-format", "stream-json",
    "--verbose",
    "--permission-mode", "acceptEdits",
    "--max-budget-usd", "{max_budget_usd}",
]
prompt_via = "stdin"
track = "claude"
model_provider = "anthropic"
model_name = "claude-sonnet-5-medium"
max_budget_usd = 10.0
tier = "mid"
status = "trial"
cost_hint = "$$"
good_for = ["novel_scripts", "diagnostic_probes", "repair_prone"]
notes = "Default escalation rung above claude-sonnet-low (--effort medium)."

# ── Test backend ─────────────────────────────────────────────────────────────
# Drives a scripted delegation through the real CLI with zero LLM calls. This is
# the permanent orchestration smoke test: it exercises the whole spawn → run →
# finish-delegation → report pipeline. Never remove it.

[backends.stub]
tool = "stub"
command = ["python3", "scripts/stub_subagent.py"]
prompt_via = "stdin"
track = "claude"
model_provider = "stub"
model_name = "stub-scripted-agent"
tier = "cheap"
status = "trial"
cost_hint = "$"
good_for = ["smoke_tests"]
avoid_for = ["recipe_tuning", "novel_scripts", "diagnostic_probes"]
notes = "Scripted, no LLM. Proposes one trivial recipe per cycle and rejects it. Testing only."

# A stub variant that deliberately exits without calling finish-delegation, so
# the `no_finish_delegation` distress flag has a real end-to-end exercise.
[backends.stub-no-finish]
tool = "stub"
command = ["python3", "scripts/stub_subagent.py", "--skip-finish"]
prompt_via = "stdin"
track = "claude"
model_provider = "stub"
model_name = "stub-scripted-agent-no-finish"
tier = "cheap"
status = "trial"
cost_hint = "$"
good_for = ["smoke_tests"]
avoid_for = ["recipe_tuning", "novel_scripts", "diagnostic_probes"]
notes = "Provokes the no_finish_delegation distress flag. Testing only."
