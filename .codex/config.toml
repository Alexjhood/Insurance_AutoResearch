model = "gpt-5.5"

approval_policy = "on-request"
sandbox_mode = "workspace-write"
approvals_reviewer = "user"

[sandbox_workspace_write]
network_access = true
exclude_tmpdir_env_var = false
exclude_slash_tmp = false
# The cross-run memory aggregator + global recipe ledger live OUTSIDE the working
# tree, under ~/.autoresearch/<project>/memory (see memory.store.memory_root).
# Without this whitelist the Codex sandbox blocks every memory write — checkpoints,
# the recipe ledger, and playbook rebuilds all fail silently, so a Codex run reads
# shared memory but never contributes (process_review_20260610_followup.md E1).
writable_roots = ["~/.autoresearch"]